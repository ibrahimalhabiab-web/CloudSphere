#cloud-config
package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - gnupg
  - openssl
  - tar
  - unattended-upgrades

write_files:
  - path: /etc/docker/daemon.json
    permissions: "0644"
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "25m",
          "max-file": "5"
        },
        "live-restore": true
      }
  - path: /usr/local/sbin/install-docker-ce
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      install -m 0755 -d /etc/apt/keyrings
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
      chmod a+r /etc/apt/keyrings/docker.asc
      . /etc/os-release
      printf '%s\n' "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu ${VERSION_CODENAME} stable" > /etc/apt/sources.list.d/docker.list
      apt-get update
      DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

runcmd:
  - /usr/local/sbin/install-docker-ce
  - systemctl enable --now docker
  - systemctl restart docker
  - |
      DEFAULT_USER="$(awk -F: '$3 == 1000 {print $1; exit}' /etc/passwd)"
      if [ -n "${DEFAULT_USER}" ]; then
        usermod -aG docker "${DEFAULT_USER}"
        install -d -o "${DEFAULT_USER}" -g "${DEFAULT_USER}" -m 0750 /opt/gitlab-stack
      fi
  - install -d -m 0700 /srv/gitlab /srv/gitlab/config /srv/gitlab/logs /srv/gitlab/data
  - systemctl enable --now unattended-upgrades

final_message: "GitLab VM bootstrap completed after $UPTIME seconds."
