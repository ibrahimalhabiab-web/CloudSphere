name: monitoring-platform

services:
  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.13.1}
    container_name: monitoring-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - ./prometheus/file_sd:/etc/prometheus/file_sd:ro
      - prometheus_data:/prometheus
    ports:
      - 127.0.0.1:9090:9090
    depends_on:
      - alertmanager
      - node-exporter
      - cadvisor
      - blackbox-exporter
      - cloudsphere-app
    networks:
      - monitoring
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  alertmanager:
    image: ${ALERTMANAGER_IMAGE:-prom/alertmanager:v0.33.1}
    container_name: monitoring-alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - 127.0.0.1:9093:9093
    networks:
      - monitoring
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:13.1.0}
    container_name: monitoring-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: "2s"
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: ${TZ:-Asia/Riyadh}
    secrets:
      - grafana_admin_password
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - 127.0.0.1:3000:3000
    depends_on:
      - prometheus
    networks:
      - monitoring
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/health | grep -q 'ok'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  node-exporter:
    image: ${NODE_EXPORTER_IMAGE:-prom/node-exporter:v1.12.1}
    container_name: monitoring-node-exporter
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    pid: host
    volumes:
      - /:/host:ro,rslave
    expose:
      - "9100"
    networks:
      - monitoring
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  cadvisor:
    image: ${CADVISOR_IMAGE:-ghcr.io/google/cadvisor:v0.60.5}
    container_name: monitoring-cadvisor
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    expose:
      - "8080"
    networks:
      - monitoring
    restart: unless-stopped

  blackbox-exporter:
    image: ${BLACKBOX_EXPORTER_IMAGE:-prom/blackbox-exporter:v0.28.0}
    container_name: monitoring-blackbox-exporter
    command:
      - --config.file=/etc/blackbox_exporter/blackbox.yml
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/blackbox.yml:ro
    expose:
      - "9115"
    networks:
      - monitoring
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  cloudsphere-app:
    build:
      context: ./cloudsphere-app
    container_name: monitoring-cloudsphere-app
    cpus: "0.80"
    mem_limit: 192m
    pids_limit: 64
    ports:
      - 127.0.0.1:8000:8000
    expose:
      - "8000"
    networks:
      - monitoring
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  cloudsphere-public:
    build:
      context: ./cloudsphere-app
    container_name: monitoring-cloudsphere-public
    profiles:
      - public
    environment:
      PUBLIC_ONLY: "true"
    cpus: "0.25"
    mem_limit: 96m
    pids_limit: 32
    expose:
      - "8000"
    networks:
      - public-edge
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  caddy:
    image: ${CADDY_IMAGE:-caddy:2.11.4-alpine}
    container_name: monitoring-caddy
    profiles:
      - public
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-www.cloudsphere-sda.online}
      PUBLIC_APEX_DOMAIN: ${PUBLIC_APEX_DOMAIN:-cloudsphere-sda.online}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      cloudsphere-public:
        condition: service_healthy
    networks:
      - public-edge
    restart: unless-stopped
    read_only: true
    cpus: "0.25"
    mem_limit: 128m
    pids_limit: 64
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  gitlab-runner:
    image: ${GITLAB_RUNNER_IMAGE:-gitlab/gitlab-runner:v19.3.0}
    container_name: monitoring-gitlab-runner
    command:
      - run
      - --user=gitlab-runner
      - --working-directory=/home/gitlab-runner
      - --listen-address=:9252
    volumes:
      - gitlab_runner_config:/etc/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - 127.0.0.1:9252:9252
    networks:
      - monitoring
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

networks:
  monitoring:
    name: monitoring_network
    driver: bridge
  public-edge:
    name: cloudsphere_public_edge
    driver: bridge

volumes:
  prometheus_data:
    name: monitoring_prometheus_data
  alertmanager_data:
    name: monitoring_alertmanager_data
  grafana_data:
    name: monitoring_grafana_data
  gitlab_runner_config:
    name: monitoring_gitlab_runner_config
  caddy_data:
    name: monitoring_caddy_data
  caddy_config:
    name: monitoring_caddy_config

secrets:
  grafana_admin_password:
    file: ./secrets/grafana_admin_password.txt
