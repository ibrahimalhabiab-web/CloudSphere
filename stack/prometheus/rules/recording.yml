groups:
  - name: platform-recording-rules
    interval: 2s
    rules:
      - record: instance:node_cpu_utilisation:ratio
        expr: 1 - avg without (cpu, mode) (rate(node_cpu_seconds_total{mode="idle"}[5m]))

      - record: instance:node_cpu_utilisation:ratio15s
        expr: 1 - avg without (cpu, mode) (irate(node_cpu_seconds_total{mode="idle"}[15s]))

      - record: instance:node_memory_utilisation:ratio
        expr: 1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)

      - record: instance:node_filesystem_utilisation:ratio
        expr: 1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"})

      - record: cloudsphere:http_error_ratio:rate30s
        expr: sum(rate(cloudsphere_http_requests_total{status=~"5.."}[30s])) / clamp_min(sum(rate(cloudsphere_http_requests_total[30s])), 0.001)

      - record: cloudsphere:http_error_ratio:rate10s
        expr: sum(rate(cloudsphere_http_requests_total{status=~"5.."}[10s])) / clamp_min(sum(rate(cloudsphere_http_requests_total[10s])), 0.001)

      - record: cloudsphere:orders:rate5m
        expr: rate(cloudsphere_orders_total[5m])

      - record: platform:gitlab_target_availability:ratio
        expr: avg(up{job="gitlab"})

      - record: platform:gitlab_endpoint_availability:ratio
        expr: avg(probe_success{job="gitlab-health"})

      - record: platform:gitlab_host_availability:ratio
        expr: avg(up{job="gitlab-node"})
