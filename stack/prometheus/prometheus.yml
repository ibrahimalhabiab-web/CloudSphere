global:
  # Keep platform-wide collection modest; the CloudSphere application overrides this below.
  scrape_interval: 5s
  evaluation_interval: 2s
  scrape_timeout: 4s
  external_labels:
    platform: azure-internal
    environment: cloudsphere

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: node
    scrape_interval: 2s
    scrape_timeout: 1s
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          role: monitoring-host

  - job_name: containers
    scrape_interval: 2s
    scrape_timeout: 1s
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: cloudsphere-application
    # Presentation mode: synchronize order and error metrics rapidly without
    # increasing scrape load on every infrastructure and GitLab target.
    scrape_interval: 2s
    scrape_timeout: 1s
    metrics_path: /metrics
    static_configs:
      - targets:
          - cloudsphere-app:8000
        labels:
          service: cloudsphere-orders

  - job_name: blackbox-exporter
    static_configs:
      - targets:
          - blackbox-exporter:9115

  - job_name: gitlab
    metrics_path: /-/metrics
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/gitlab-metrics.yml
        refresh_interval: 30s

  - job_name: gitlab-node
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/gitlab-node.yml
        refresh_interval: 30s

  - job_name: gitlab-runner
    static_configs:
      - targets:
          - gitlab-runner:9252

  - job_name: gitlab-health
    metrics_path: /probe
    params:
      module:
        - http_2xx
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/gitlab-health.yml
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: service-uptime
    metrics_path: /probe
    params:
      module:
        - http_2xx
    static_configs:
      - targets:
          - http://grafana:3000/api/health
          - http://prometheus:9090/-/healthy
          - http://alertmanager:9093/-/healthy
          - http://cloudsphere-app:8000/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
