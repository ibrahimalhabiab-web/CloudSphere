global:
  resolve_timeout: 5m

route:
  receiver: operations-webhook
  group_by:
    - alertname
    - instance
  group_wait: 2s
  group_interval: 10s
  repeat_interval: 4h

receivers:
  - name: operations-webhook
    webhook_configs:
      - url: http://demo-app:8000/alerts
        send_resolved: true
        max_alerts: 20

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal:
      - alertname
      - instance
